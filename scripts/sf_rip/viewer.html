<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>body{margin:0;background:#1a1a2e;overflow:hidden}#info{position:fixed;top:8px;left:8px;color:#fff;font:12px monospace}</style>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<div id="info">loading…</div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a2e);
const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.01, 100);
const renderer = new THREE.WebGLRenderer({antialias: true});
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
scene.add(new THREE.AmbientLight(0xffffff, 1.2));
const dl = new THREE.DirectionalLight(0xffffff, 2.0);
dl.position.set(3, 5, 4);
scene.add(dl);
const dl2 = new THREE.DirectionalLight(0xffffff, 1.0);
dl2.position.set(-4, 2, -3);
scene.add(dl2);

const loader = new GLTFLoader();
loader.load('/model.glb', (gltf) => {
  const model = gltf.scene;
  scene.add(model);
  const box = new THREE.Box3().setFromObject(model);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z);
  camera.position.set(center.x + maxDim*0.9, center.y + maxDim*0.45, center.z + maxDim*1.1);
  camera.lookAt(center);
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.target.copy(center);
  document.getElementById('info').textContent =
    `verts ok | size ${size.x.toFixed(2)} x ${size.y.toFixed(2)} x ${size.z.toFixed(2)}`;
  window.__loaded = true;
  let t = 0;
  (function anim(){
    t += 0.016;
    controls.update();
    renderer.render(scene, camera);
    if (t < 120) requestAnimationFrame(anim);
  })();
}, (ev) => {
  if (ev.total) document.getElementById('info').textContent = `loading ${(100*ev.loaded/ev.total).toFixed(0)}%`;
}, (err) => {
  document.getElementById('info').textContent = 'ERROR: ' + err;
  window.__error = String(err);
});
window.__scene = scene;
</script>
</body>
</html>
